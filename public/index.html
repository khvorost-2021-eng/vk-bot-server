<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Экскурсовод</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <button class="back-btn" id="backBtn" onclick="goBack()" style="display: none;">←</button>
        <h1>Экскурсовод</h1>
    </div>

    <div class="main-screen" id="mainScreen">
        <button class="main-btn" onclick="openScreen('excursions')">
            <span class="btn-icon">🏛️</span>
            <span class="btn-text">Экскурсии</span>
        </button>
        <button class="main-btn" onclick="openScreen('myBookings')">
            <span class="btn-icon">📋</span>
            <span class="btn-text">Мои записи</span>
        </button>

        <button class="main-btn admin-btn" id="adminBtn" onclick="openScreen('admin')" style="display: none;">
            <span class="btn-icon">⚙️</span>
            <span class="btn-text">Админ-панель</span>
        </button>
    </div>

    <div class="content" id="content"></div>

    <script src="script.js"></script>
</body>
</html>
